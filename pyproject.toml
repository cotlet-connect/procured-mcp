[project]
name = "procured-mcp"
version = "1.1.0"
description = "Connect Procured to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No Procured API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["procured", "procured api", "procured mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/procured-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=procured"
Source = "https://github.com/cotlet-connect/procured-mcp"

[project.scripts]
procured-mcp = "procured_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"procured_agent.py" = "procured_agent.py"

[tool.hatch.build.targets.sdist]
include = ["procured_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
